name: open-bot

services:
  open-bot:
    image: open-bot:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_DOCS_URL: ${VITE_DOCS_URL:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
      GUILD_ID: ${GUILD_ID:?Set GUILD_ID in .env}
      CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID in .env}
      CLIENT_SECRET: ${CLIENT_SECRET:?Set CLIENT_SECRET in .env}
      REDIRECT: ${REDIRECT:?Set REDIRECT in .env}
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_PATH: /app/data/open-bot.sqlite
      ADMIN_ROLE_ID: ${ADMIN_ROLE_ID:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_ID: ${LOG_ID:-}
      LOG_WEBHOOK: ${LOG_WEBHOOK:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-open-bot}
      TICKETS_ENABLED: ${TICKETS_ENABLED:-false}
      GAME_SERVER_HOSTS: ${GAME_SERVER_HOSTS:-}
      WATCHDOG_HOSTS: ${WATCHDOG_HOSTS:-}
      WATCHDOG_TOKEN_MAIN: ${WATCHDOG_TOKEN_MAIN:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: '9091'
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      INTEGRATION_KEY: ${INTEGRATION_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000'
      - '${METRICS_BIND_ADDRESS:-127.0.0.1}:${METRICS_PORT:-9091}:9091'
    volumes:
      - open-bot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${MEMORY_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 256m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  open-bot-data:
  redis-data:
