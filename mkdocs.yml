site_name: Open Bot
site_description: Руководства пользователя и разработчика Open Bot
site_url: https://cryals.github.io/open-bot/
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cryals/open-bot
      name: Репозиторий Open Bot
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: material
  language: ru
  font: false
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  palette:
    scheme: slate
    primary: black
    accent: grey
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: [ru, en]
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.superfences
  - pymdownx.details
exclude_docs: |
  superpowers/
  REVIEW-*.md
  ARTWORK.md
  open-bot.service
nav:
  - Главная: README.md
  - Пользователю:
      - Обзор: user/README.md
      - Установка: user/setup.md
      - Правила и информация: user/rules.md
      - Сообщения бота: user/messages.md
      - Тикеты: user/tickets.md
      - Игровые серверы: user/game-servers.md
      - Watchdog: user/watchdog.md
      - Метрики и Grafana: user/metrics.md
      - Модули сообщества: user/community.md
      - Журнал и восстановление: user/logs.md
      - Команды: user/commands.md
      - Решение проблем: user/troubleshooting.md
      - Эксплуатация: OPERATIONS.md
      - Docker Compose: DOCKER.md
  # module-reference-nav:start
  - Модули:
      - Все модули: user/catalog.md
      - 'Core': user/modules/core.md
      - 'Help': user/modules/help.md
      - 'Info': user/modules/info.md
      - 'Ticket': user/modules/ticket.md
      - 'Metrics': user/modules/metrics.md
      - 'Game Server Status': user/modules/game-server-status.md
      - 'SS14 Watchdog': user/modules/watchdog.md
      - 'Moderation': user/modules/moderation.md
      - 'Moderation Logs': user/modules/moderation-logs.md
      - 'Community Core': user/modules/community.md
      - 'AutoMod': user/modules/automod.md
      - 'AutoBan': user/modules/autoban.md
      - 'AntiRaid': user/modules/anti-raid.md
      - 'Slowmode': user/modules/slowmode.md
      - 'Панели ролей': user/modules/role-menus.md
      - 'Автоответы': user/modules/autoresponder.md
      - 'Свои команды': user/modules/custom-commands.md
      - 'Формы и апелляции': user/modules/forms.md
      - 'Розыгрыши': user/modules/giveaways.md
      - 'Подписки': user/modules/subscriptions.md
      - 'Starboard': user/modules/starboard.md
      - 'Копии Discord-сервера': user/modules/guild-backup.md
      - 'Web': user/modules/web.md
  # module-reference-nav:end
  - Разработчику:
      - Обзор: developer/README.md
      - Архитектура: developer/architecture.md
      - Модули: developer/modules.md
      - Модули сообщества: developer/community.md
      - Тикеты и внешние сервисы: developer/integrations.md
      - Телеметрия: developer/telemetry.md
      - Разработка и выпуск: developer/workflow.md
      - Навыки Codex: developer/skills.md
      - Runtime: MODULES.md
      - Производительность: PERFORMANCE.md
  - Релиз 1.0: RELEASE-1.0.md
  - Новые модули: COMMUNITY-RELEASE.md
